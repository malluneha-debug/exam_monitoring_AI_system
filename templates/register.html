<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Candidate Registration</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div style="background: white; padding: 40px; border-radius: 10px; box-shadow: 0 6px 15px rgba(0,0,0,0.15); width: 500px;">
        <h2 style="margin-top: 0; text-align: center; font-size: 26px; color: #333;">Candidate Registration</h2>
        {% if error %}<p style="color: red; font-size: 15px; text-align: center;">{{ error }}</p>{% endif %}
        
        <form method="POST">
            <label style="font-size: 16px; font-weight: bold; color: #444;">Full Name / Username:</label><br>
            <input type="text" name="username" required style="width: 100%; padding: 10px; font-size: 16px; margin: 8px 0 16px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;"><br>
            
            <label style="font-size: 16px; font-weight: bold; color: #444;">Email Address:</label><br>
            <input type="email" name="email" required style="width: 100%; padding: 10px; font-size: 16px; margin: 8px 0 16px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;"><br>
            
            <label style="font-size: 16px; font-weight: bold; color: #444;">Password:</label><br>
            <input type="password" name="password" required style="width: 100%; padding: 10px; font-size: 16px; margin: 8px 0 16px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;"><br>

            <label style="font-size: 16px; font-weight: bold; color: #444;">Capture Photo:</label>
            <div style="text-align: center; margin: 8px 0 16px 0;">
                <video id="video" autoplay style="width: 100%; height: 220px; background: #000; border-radius: 5px; border: 2px solid #16a34a; object-fit: cover; box-sizing: border-box;"></video><br>
                <button type="button" onclick="captureSnapshot()" style="width: 100%; background: #0284c7; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; font-weight: bold; margin-top: 8px; box-sizing: border-box;">Capture Photo</button>
                <canvas id="canvas" style="display: none;"></canvas>
                <input type="hidden" name="image_data" id="image_data">
            </div>

            <button type="submit" style="width: 100%; background: #16a34a; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; box-sizing: border-box;">Submit Registration</button>
        </form>
        <p style="margin-top: 20px; text-align: center; font-size: 15px;">Already registered? <a href="/login" style="color: #2563eb; text-decoration: none; font-weight: bold;">Login here</a></p>
    </div>

    <script>
        const video = document.getElementById('video');
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { console.error("Webcam error:", err); });

        function captureSnapshot() {
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            document.getElementById('image_data').value = canvas.toDataURL('image/jpeg');
            alert("Photo Captured Successfully!");
        }
    </script>
</body>
</html>
