<!DOCTYPE html>
<html lang="en">
<head><title>Exam Integrity Summary</title></head>
<body style="font-family:Arial; background:#f4f4f9; padding:30px; text-align:center;">
    <div style="max-width:600px; margin:0 auto; background:white; padding:30px; border-radius:8px; box-shadow:0 4px 8px rgba(0,0,0,0.1);">
        <h2>Exam Submitted Successfully!</h2>
        <p>Candidate: <b>{{ username }}</b></p>
        
        <div style="background:#f8fafc; padding:20px; border-radius:8px; margin:20px 0; border:1px solid #e2e8f0;">
            <h3>INTEGRITY SCORE</h3>
            <h1 style="color: {% if integrity_score >= 80 %}#16a34a{% elif integrity_score >= 50 %}#ca8a04{% else %}#dc2626{% endif %}; font-size:48px; margin:10px 0;">{{ integrity_score }}/100</h1>
            <p><b>Risk Status:</b> {% if integrity_score >= 80 %}Low Risk{% elif integrity_score >= 50 %}Medium Risk{% else %}High Risk{% endif %}</p>
        </div>

        <h3>🤖 AI Integrity Summary</h3>
        <p style="background:#eff6ff; padding:15px; border-left:4px solid #3b82f6; border-radius:4px; text-align:left; white-space: pre-line;">{{ ai_summary }}</p>

        <div style="margin-top:20px; display:flex; justify-content:center; gap:10px;">
            <a href="/login"><button style="background:#2563eb; color:white; padding:10px 15px; border:none; border-radius:4px; cursor:pointer;">Back to Login</button></a>
            <a href="/admin"><button style="background:#475569; color:white; padding:10px 15px; border:none; border-radius:4px; cursor:pointer;">Admin Dashboard</button></a>
        </div>
    </div>
</body>
</html>
